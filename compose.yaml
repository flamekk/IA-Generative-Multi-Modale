services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: maintidoc-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-maintidoc}
      POSTGRES_USER: ${PG_USER:-maintidoc}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-maintidoc-local-only}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - maintidoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  maintidoc_pgdata:
